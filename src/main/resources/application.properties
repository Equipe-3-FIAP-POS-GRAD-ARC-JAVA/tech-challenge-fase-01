spring.application.name=tech-challenge-fase-01

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

# spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:db/postgres/schema.sql
#spring.sql.init.data-locations=classpath:db/postgres/data.sql

#spring.mvc.problemdetails.enabled=true

# JWT Configuration
jwt.issuer=tech-challenge-fase-01
jwt.secret-key=${JWT_SECRET_KEY:my-secret-key-change-in-production-minimum-256-bits-required}
jwt.expiration-minute=${JWT_EXPIRATION_MINUTE:60}
